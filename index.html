<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Etsy Listing Builder</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f6f5;--card:#fff;--ink:#14211e;--mut:#5d6f6b;--line:#d5dfdc;--acc:#0f6b5c;--accink:#fff;--warn:#b3261e;--ok:#0f6b5c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1614;--card:#16211f;--ink:#e6efed;--mut:#8ea39e;--line:#2a3a37;--acc:#3fbfa8;--accink:#06201b;--warn:#ff8a80;--ok:#3fbfa8}}
:root[data-theme="dark"]{--bg:#0e1614;--card:#16211f;--ink:#e6efed;--mut:#8ea39e;--line:#2a3a37;--acc:#3fbfa8;--accink:#06201b;--warn:#ff8a80;--ok:#3fbfa8}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:14px;background:var(--card)}
aside h1{font:700 17px/1.2 Georgia,"Times New Roman",serif;margin:0 0 12px}
.li{display:block;width:100%;text-align:left;padding:8px 10px;margin-bottom:4px;border:1px solid transparent;border-radius:8px;background:none;color:var(--ink);cursor:pointer;font:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent);font-weight:600}
main{padding:18px;max-width:820px;width:100%}
button{font:inherit;cursor:pointer}
.b{padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.b.p{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600}
.b.s{padding:3px 9px;font-size:13px}
.b:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.f{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.fh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.fh label{font-weight:600;flex:1}
.cnt{font-size:12.5px;color:var(--mut)}.cnt.bad{color:var(--warn);font-weight:600}
.hint{font-size:12.5px;color:var(--mut);margin:4px 0 0}
input[type=text],textarea,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:110px;resize:vertical}
.ed{display:flex;gap:6px;margin-bottom:6px}.ed input{flex:1}.ed select{width:110px}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px}
.im{border:1px solid var(--line);border-radius:8px;padding:6px;font-size:12px;background:var(--bg)}
.im img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block}
.im div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin:3px 0}
.im .r{display:flex;gap:3px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.stat{font-size:12.5px;color:var(--mut);margin:0 0 10px}[hidden]{display:none!important}.login{max-width:340px;margin:12vh auto;padding:20px}.login h1{font:700 22px Georgia,serif;margin:0 0 14px}.login input{margin-bottom:8px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.card h2{font:700 16px/1.2 Georgia,"Times New Roman",serif;margin:0 0 4px}
.card .f{border:0;padding:0;background:none;margin:14px 0 0}
.card .fh h2{flex:1;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{display:inline-flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:1px 3px 1px 10px;font-size:14px}
.chip button{background:none;border:0;color:var(--ink);padding:3px 5px;cursor:pointer;font:inherit}
.chip .cx{color:var(--mut)}
.chip.lb{opacity:.7}.chip.lb.on{opacity:1;border-color:var(--acc)}
.row{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}.row input{flex:1;min-width:140px}
.lib{margin-top:8px}
.tw{overflow-x:auto;margin-top:8px}
.vt{width:100%;border-collapse:collapse;min-width:680px}
.vt th,.vt td{text-align:left;padding:5px 6px;border-bottom:1px solid var(--line);font-size:14px}
.vt input[type=text]{width:90px}.vt select{min-width:190px}
.im video{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block}
.feat{font-size:11px;font-weight:700;color:var(--acc)}
.li small{display:block;color:var(--mut);font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
@media (max-width:700px){.app{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line)}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div id="login" class="login" hidden>
<h1>Etsy Listing Builder</h1>
<input type="text" id="em" placeholder="Email" autocomplete="username">
<input type="password" id="pw" placeholder="Password" autocomplete="current-password" style="width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;margin-bottom:8px">
<button class="b p" id="go" style="width:100%">Sign in</button>
<p class="hint" id="lerr"></p>
</div>
<div class="app" id="app" hidden>
<aside><h1>Listings</h1><div id="list"></div><button class="b p" id="add" style="width:100%;margin-top:8px">New listing</button><button class="b s" id="out" style="width:100%;margin-top:8px">Sign out</button></aside>
<main><p class="stat" id="stat">Loading...</p><div id="main"></div></main>
</div>
<div class="toast" id="toast"></div>
<script type="module" src="app.js"></script>
</body>
</html>
